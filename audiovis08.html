<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch Hör-Quiz: 8 Farben</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --error: #e74c3c;
            --bg: #f4f7f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .progress {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* Lautsprecher Button */
        .audio-trigger {
            background: var(--accent);
            border: none;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            cursor: pointer;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
            transition: all 0.2s;
        }

        .audio-trigger:hover { transform: scale(1.05); background: #2980b9; }
        .audio-trigger svg { fill: white; width: 45px; height: 45px; }

        /* Farb-Grid */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .color-card {
            background: #fff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px 5px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .shoe-icon {
            font-size: 3rem;
            line-height: 1;
            /* Standard Schatten für bessere Sichtbarkeit heller Farben */
            filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.2));
        }

        .color-name {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--primary);
        }

        .color-card:hover { border-color: var(--accent); transform: translateY(-3px); }
        
        .color-card.correct {
            border-color: var(--success);
            background-color: #f0fff4;
            pointer-events: none;
        }

        .color-card.wrong {
            border-color: var(--error);
            background-color: #fff5f5;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        button.nav-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        #next-btn { background: var(--success); color: white; display: none; }
        #reset-btn { background: #edf2f7; color: #4a5568; }

        /* Responsive Design */
        @media (max-width: 600px) {
            .color-grid { grid-template-columns: repeat(2, 1fr); }
            .audio-trigger { width: 75px; height: 75px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress" id="progress">Aufgabe 1 von 8</div>
    <h2 style="margin-bottom: 20px; color: var(--primary);">Какой это цвет?</h2>

    <button class="audio-trigger" id="play-btn" title="Farbe hören">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </button>

    <div class="color-grid" id="grid">
        <!-- Karten werden per JS eingefügt -->
    </div>

    <div id="feedback" style="min-height: 24px; font-weight: bold; margin-bottom: 15px;"></div>

    <div class="controls">
        <button id="reset-btn" class="nav-btn">Neustart</button>
        <button id="next-btn" class="nav-btn">Richtig! Weiter →</button>
    </div>
</div>

<script>
    const colorTasks = [
        { ru: "коричневый", hex: "#8B4513" },
        { ru: "чёрный", hex: "#000000" },
        { ru: "синий", hex: "#0000FF" },
        { ru: "белый", hex: "#FFFFFF" },
        { ru: "красный", hex: "#FF0000" },
        { ru: "зелёный", hex: "#008000" },
        { ru: "жёлтый", hex: "#FFD700" },
        { ru: "серый", hex: "#808080" }
    ];

    let currentIdx = 0;
    let synth = window.speechSynthesis;
    let russianVoice = null;

    // Suche nach russischer männlicher Stimme
    function loadVoice() {
        const voices = synth.getVoices();
        russianVoice = voices.find(v => v.lang.startsWith('ru') && 
            (v.name.includes('Pavel') || v.name.includes('Dmitry') || v.name.includes('Maxim'))) 
            || voices.find(v => v.lang.startsWith('ru'));
    }

    if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoice;

    function speak(text) {
        if (synth.speaking) synth.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.voice = russianVoice;
        utter.lang = 'ru-RU';
        utter.pitch = 0.85; // Tiefer für männlichen Klang
        utter.rate = 0.85;
        synth.speak(utter);
    }

    function initTurn() {
        loadVoice();
        const task = colorTasks[currentIdx];
        document.getElementById('progress').textContent = `Aufgabe ${currentIdx + 1} von ${colorTasks.length}`;
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('feedback').textContent = "";
        
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        // Zufällige Anordnung der Karten
        const shuffled = [...colorTasks].sort(() => Math.random() - 0.5);

        shuffled.forEach(item => {
            const card = document.createElement('div');
            card.className = 'color-card';
            card.dataset.color = item.ru;
            
            // Stiefel-Icon mit dynamischer Farbe
            card.innerHTML = `
                <span class="shoe-icon" style="color: ${item.hex}">👢</span>
                <span class="color-name">${item.ru}</span>
            `;
            card.onclick = () => checkAnswer(card, item.ru);
            grid.appendChild(card);
        });
        
        // Optional: Automatisch abspielen
        // setTimeout(() => speak(task.ru), 500);
    }

    function checkAnswer(card, selectedColor) {
        const correctColor = colorTasks[currentIdx].ru;
        const allCards = document.querySelectorAll('.color-card');
        const feedback = document.getElementById('feedback');

        if (selectedColor === correctColor) {
            card.classList.add('correct');
            feedback.style.color = "var(--success)";
            feedback.textContent = "Правильно! ✅";
            allCards.forEach(c => c.style.pointerEvents = 'none');
            document.getElementById('next-btn').style.display = 'block';
        } else {
            card.classList.add('wrong');
            feedback.style.color = "var(--error)";
            feedback.textContent = "Нет, попробуй ещё раз!";
            setTimeout(() => card.classList.remove('wrong'), 800);
        }
    }

    document.getElementById('play-btn').onclick = () => {
        speak(colorTasks[currentIdx].ru);
    };

    document.getElementById('next-btn').onclick = () => {
        currentIdx++;
        if (currentIdx < colorTasks.length) {
            initTurn();
        } else {
            showEnd();
        }
    };

    function showEnd() {
        document.querySelector('.container').innerHTML = `
            <div style="padding: 40px 10px;">
                <h1 style="font-size:4rem; margin:0;">🏆</h1>
                <h2 style="color: var(--primary);">Hervorragend!</h2>
                <p>Du hast alle 8 Farben im Schuhgeschäft gemeistert.</p>
                <button onclick="location.reload()" class="nav-btn" style="background:var(--accent); color:white; padding:15px 30px; margin-top:20px;">Nochmal spielen</button>
            </div>
        `;
    }

    document.getElementById('reset-btn').onclick = () => location.reload();

    // Startverzögerung damit Stimmen geladen werden
    setTimeout(() => {
        loadVoice();
        initTurn();
    }, 300);
</script>

</body>
</html>
