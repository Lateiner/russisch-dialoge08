<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch-Übersetzung: Sätze verbinden</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --error: #e74c3c;
            --bg: #fdfefe;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 { font-size: 1.4rem; color: var(--primary); margin-bottom: 20px; }

        .matching-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .column h2 {
            font-size: 1rem;
            color: #7f8c8d;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item {
            padding: 15px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            touch-action: manipulation;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.3;
        }

        /* Status-Stile */
        .item.selected {
            border-color: var(--accent);
            background-color: #ebf8ff;
            transform: scale(1.02);
        }

        .item.correct {
            cursor: default;
            pointer-events: none;
            border-color: rgba(0,0,0,0.1);
            font-weight: 600;
        }

        .item.wrong {
            border-color: var(--error);
            background-color: #fff5f5;
            animation: shake 0.4s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        #solution-btn { background: var(--primary); color: white; }
        #reset-btn { background: #edf2f7; color: #4a5568; }

        @media (max-width: 600px) {
            .matching-area { gap: 10px; }
            .item { font-size: 0.85rem; padding: 10px; }
            h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Dialog: Sätze zuordnen</h1>

    <div class="matching-area">
        <div class="column" id="col-ru"></div>
        <div class="column" id="col-de"></div>
    </div>

    <div class="controls">
        <button id="solution-btn">Lösung anzeigen</button>
        <button id="reset-btn">Neustart</button>
    </div>
</div>

<script>
    const pairs = [
        { id: 0, ru: "Я ищу длинное платье.", de: "Ich suche ein langes Kleid." },
        { id: 1, ru: "Какой у вас размер?", de: "Welche Größe haben Sie?" },
        { id: 2, ru: "Первое мне велико.", de: "Das erste ist mir zu groß." },
        { id: 3, ru: "Я примерю оба.", de: "Ich probiere beide an." },
        { id: 4, ru: "Будете платить картой?", de: "Zahlen Sie mit Karte?" },
        { id: 5, ru: "Спасибо за покупку.", de: "Danke für den Einkauf." },
        { id: 6, ru: "На размер меньше.", de: "Eine Nummer kleiner." },
        { id: 7, ru: "Синего цвета.", de: "In blauer Farbe." }
    ];

    // Individuelle Farben für die Paare (Pastelltöne)
    const pairColors = [
        "#FFADAD", "#FFD6A5", "#FDFFB6", "#CAFFBF", 
        "#9BF6FF", "#A0C4FF", "#BDB2FF", "#FFC6FF"
    ];

    let selectedRu = null;
    let selectedDe = null;

    function init() {
        selectedRu = null;
        selectedDe = null;
        
        const shuffledRu = [...pairs].sort(() => Math.random() - 0.5);
        const shuffledDe = [...pairs].sort(() => Math.random() - 0.5);
        
        renderColumn('ru', shuffledRu, 'Russisch');
        renderColumn('de', shuffledDe, 'Deutsch');
    }

    function renderColumn(lang, data, title) {
        const col = document.getElementById(`col-${lang}`);
        col.innerHTML = `<h2>${title}</h2>`;
        data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item';
            div.textContent = item[lang];
            div.dataset.id = item.id;
            div.onclick = () => handleSelect(div, lang);
            col.appendChild(div);
        });
    }

    function handleSelect(element, lang) {
        if (element.classList.contains('correct')) return;

        if (lang === 'ru') {
            if (selectedRu) selectedRu.classList.remove('selected');
            selectedRu = element;
        } else {
            if (selectedDe) selectedDe.classList.remove('selected');
            selectedDe = element;
        }
        element.classList.add('selected');

        if (selectedRu && selectedDe) {
            checkMatch();
        }
    }

    function checkMatch() {
        const idRu = selectedRu.dataset.id;
        const idDe = selectedDe.dataset.id;

        if (idRu === idDe) {
            // Richtig -> Farbe zuweisen
            const color = pairColors[idRu];
            applyMatch(selectedRu, selectedDe, color);
            selectedRu = null;
            selectedDe = null;
        } else {
            // Falsch
            selectedRu.classList.add('wrong');
            selectedDe.classList.add('wrong');
            const sr = selectedRu;
            const sd = selectedDe;
            setTimeout(() => {
                sr.classList.remove('wrong', 'selected');
                sd.classList.remove('wrong', 'selected');
            }, 500);
            selectedRu = null;
            selectedDe = null;
        }
    }

    function applyMatch(el1, el2, color) {
        el1.classList.remove('selected');
        el2.classList.remove('selected');
        el1.classList.add('correct');
        el2.classList.add('correct');
        el1.style.backgroundColor = color;
        el2.style.backgroundColor = color;
    }

    // Lösung anzeigen
    document.getElementById('solution-btn').onclick = () => {
        const ruItems = document.querySelectorAll('#col-ru .item');
        const deItems = document.querySelectorAll('#col-de .item');

        ruItems.forEach(ru => {
            const id = ru.dataset.id;
            const de = Array.from(deItems).find(item => item.dataset.id === id);
            applyMatch(ru, de, pairColors[id]);
        });
    };

    document.getElementById('reset-btn').onclick = init;

    // Start
    init();
</script>

</body>
</html>
