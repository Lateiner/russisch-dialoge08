<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch-Grammatik: Schuhgrößen</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --error: #e74c3c;
            --bg: #f0f4f8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .progress {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        /* Aufgabenkarte */
        .task-card {
            background: #f9fbff;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            padding: 30px 20px;
            margin-bottom: 25px;
        }

        .emoji { font-size: 3rem; margin-bottom: 10px; display: block; }
        
        .phrase {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary);
            line-height: 1.4;
        }

        .gap {
            color: var(--accent);
            border-bottom: 3px solid var(--accent);
            padding: 0 8px;
            min-width: 60px;
            display: inline-block;
        }

        .hint {
            display: block;
            font-size: 0.95rem;
            color: #64748b;
            margin-top: 15px;
            font-style: italic;
        }

        /* Antwort-Optionen */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option-btn {
            padding: 14px;
            background: white;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--primary);
        }

        .option-btn:hover { border-color: var(--accent); background: #f1f9ff; }
        .option-btn.correct { background-color: var(--success); color: white; border-color: var(--success); }
        .option-btn.wrong { background-color: var(--error); color: white; border-color: var(--error); }

        /* Steuerung */
        .controls { margin-top: 25px; display: flex; gap: 10px; justify-content: center; }
        
        button.nav { padding: 12px 24px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        #next-btn { background: var(--primary); color: white; display: none; }
        #solution-btn { background: #e2e8f0; color: #475569; }

        #feedback { margin-top: 20px; font-weight: bold; min-height: 24px; font-size: 1.1rem; }

        /* End-Ansicht */
        #result-view { display: none; }

        @media (max-width: 480px) {
            .phrase { font-size: 1.2rem; }
            .options-grid { grid-template-columns: 1fr; }
            .container { padding: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="game-view">
        <div class="progress" id="progress">Aufgabe 1 von 8</div>
        <h1 style="font-size: 1.4rem; color: var(--primary);">Welche Endung passt?</h1>

        <div class="task-card">
            <span class="emoji">👢</span>
            <div class="phrase">
                <span id="sentence-start">У меня тридцать восьм</span><span id="adj-gap" class="gap">...</span> <span id="noun">размер</span>.
            </div>
            <span class="hint">Hinweis: "размер" ist männlich.</span>
        </div>

        <div id="options" class="options-grid"></div>

        <div id="feedback"></div>

        <div class="controls">
            <button id="solution-btn" class="nav" onclick="showSolution()">Lösung</button>
            <button id="next-btn" class="nav" onclick="nextQuestion()">Weiter →</button>
        </div>
    </div>

    <div id="result-view">
        <span class="emoji">🏆</span>
        <h2 style="color: var(--primary);">Hervorragend!</h2>
        <p>Du hast gelernt, dass Schuhgrößen im Russischen männliche Endungen haben, weil sie sich auf das Wort <strong>размер</strong> beziehen.</p>
        <button class="nav" style="background: var(--primary); color: white;" onclick="resetGame()">Nochmal starten</button>
    </div>
</div>

<script>
    const questions = [
        { start: "У меня тридцать восьм", size: "38", correct: "ой", options: ["ой", "ая", "ое", "ые"] },
        { start: "Мне нужен сорок втор", size: "42", correct: "ой", options: ["ый", "ая", "ой", "ое"] },
        { start: "Ваш тридцать шест", size: "36", correct: "ой", options: ["ой", "ая", "ий", "ые"] },
        { start: "Это сороков", size: "40", correct: "ой", options: ["ой", "ая", "ое", "ые"] },
        { start: "Ей нужен тридцать седьм", size: "37", correct: "ой", options: ["ый", "ая", "ое", "ой"] },
        { start: "У него сорок четвёрт", size: "44", correct: "ый", options: ["ый", "ая", "ой", "ое"] },
        { start: "Ваш тридцать девят", size: "39", correct: "ый", options: ["ый", "ая", "ое", "ые"] },
        { start: "Мой сорок перв", size: "41", correct: "ый", options: ["ый", "ая", "ой", "ое"] }
    ];

    let currentIdx = 0;

    function initQuestion() {
        document.getElementById('game-view').style.display = "block";
        document.getElementById('result-view').style.display = "none";

        const q = questions[currentIdx];
        document.getElementById('progress').textContent = `Aufgabe ${currentIdx + 1} von ${questions.length}`;
        document.getElementById('sentence-start').textContent = q.start;
        
        const gap = document.getElementById('adj-gap');
        gap.textContent = "...";
        gap.style.color = "var(--accent)";
        document.getElementById('feedback').textContent = "";
        document.getElementById('next-btn').style.display = "none";
        document.getElementById('solution-btn').style.display = "block";

        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.onclick = () => checkAnswer(btn, opt);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(btn, choice) {
        const q = questions[currentIdx];
        const feedback = document.getElementById('feedback');
        const gap = document.getElementById('adj-gap');
        const allBtns = document.querySelectorAll('.option-btn');

        if (choice === q.correct) {
            btn.classList.add('correct');
            gap.textContent = q.correct;
            gap.style.color = "var(--success)";
            feedback.style.color = "var(--success)";
            feedback.textContent = "Правильно! (Richtig!) ✅";
            allBtns.forEach(b => b.style.pointerEvents = "none");
            document.getElementById('next-btn').style.display = "block";
            document.getElementById('solution-btn').style.display = "none";
        } else {
            btn.classList.add('wrong');
            feedback.style.color = "var(--error)";
            feedback.textContent = "Leider falsch. Versuchs nochmal!";
            setTimeout(() => btn.classList.remove('wrong'), 800);
        }
    }

    function showSolution() {
        const q = questions[currentIdx];
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(btn => {
            if (btn.textContent === q.correct) {
                checkAnswer(btn, q.correct);
            }
        });
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            initQuestion();
        } else {
            document.getElementById('game-view').style.display = "none";
            document.getElementById('result-view').style.display = "block";
        }
    }

    function resetGame() {
        currentIdx = 0;
        initQuestion();
    }

    window.onload = initQuestion;
</script>

</body>
</html>
