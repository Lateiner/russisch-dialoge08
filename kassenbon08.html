<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch-Transfer: Kassenbon-Check</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --error: #e74c3c;
            --bg: #f0f2f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .task-box {
            background: #f8f9fa;
            border: 2px solid #edf2f7;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #current-task { font-size: 1.1rem; font-weight: bold; color: var(--primary); }
        #feedback { margin-top: 5px; font-weight: bold; height: 20px; }

        /* Der Kassenbon (SVG) */
        .receipt-container {
            position: relative;
            max-width: 320px;
            margin: 0 auto;
            background: white;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .hotspot {
            fill: transparent;
            cursor: pointer;
            transition: fill 0.3s;
        }

        /* Highlight-Effekt bei Erfolg */
        .correct-flash { fill: rgba(39, 174, 96, 0.3) !important; }
        .wrong-flash { fill: rgba(231, 76, 60, 0.3) !important; }

        .controls {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        #solution-btn { background: var(--primary); color: white; }
        #reset-btn { background: #eee; color: #333; }

        @media (max-width: 400px) {
            h1 { font-size: 1.2rem; }
            #current-task { font-size: 1rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Kassenbon-Check</h1>
    
    <div class="task-box">
        <div id="current-task">Lade Aufgabe...</div>
        <div id="feedback"></div>
    </div>

    <div class="receipt-container">
        <!-- Der Kassenbon als interaktive Grafik -->
        <svg viewBox="0 0 300 450" xmlns="http://www.w3.org/2000/svg">
            <!-- Papier-Hintergrund -->
            <rect width="300" height="450" fill="#fff" />
            <path d="M0 0 L300 0 L300 440 L290 450 L280 440 L270 450 L260 440 L250 450 L240 440 L230 450 L220 440 L210 450 L200 440 L190 450 L180 440 L170 450 L160 440 L150 450 L140 440 L130 450 L120 440 L110 450 L100 440 L90 450 L80 440 L70 450 L60 440 L50 450 L40 440 L30 450 L20 440 L10 450 L0 440 Z" fill="#fff" stroke="#ccc" />

            <!-- Text-Inhalt -->
            <text x="150" y="40" font-family="Courier New, monospace" font-size="20" font-weight="bold" text-anchor="middle">ОДЕЖДА</text>
            <text x="150" y="65" font-family="Courier New, monospace" font-size="12" text-anchor="middle">ул. Арбат, 15, Москва</text>
            
            <line x1="20" y1="85" x2="280" y2="85" stroke="#000" stroke-dasharray="5,5" />
            
            <text x="20" y="110" font-family="Courier New, monospace" font-size="12">ЧЕК № 0452</text>
            <text x="280" y="110" font-family="Courier New, monospace" font-size="12" text-anchor="end">12.05.2024</text>
            
            <text x="20" y="150" font-family="Courier New, monospace" font-size="14">ПЛАТЬЕ СИНЕЕ (M)</text>
            <text x="280" y="150" font-family="Courier New, monospace" font-size="14" text-anchor="end">4500.00</text>
            
            <text x="20" y="180" font-family="Courier New, monospace" font-size="14">ЮБКА ЧЕРНАЯ (S)</text>
            <text x="280" y="180" font-family="Courier New, monospace" font-size="14" text-anchor="end">2200.00</text>

            <line x1="20" y1="210" x2="280" y2="210" stroke="#000" />

            <text x="20" y="240" font-family="Courier New, monospace" font-size="18" font-weight="bold">ИТОГО:</text>
            <text x="280" y="240" font-family="Courier New, monospace" font-size="18" font-weight="bold" text-anchor="end">6700.00 руб</text>
            
            <text x="20" y="280" font-family="Courier New, monospace" font-size="14">ОПЛАТА: КАРТОЙ</text>
            
            <line x1="20" y1="310" x2="280" y2="310" stroke="#000" stroke-dasharray="5,5" />
            
            <text x="150" y="350" font-family="Courier New, monospace" font-size="14" text-anchor="middle">СПАСИБО ЗА ПОКУПКУ!</text>
            <text x="150" y="375" font-family="Courier New, monospace" font-size="12" text-anchor="middle">www.odezhda-shop.ru</text>

            <!-- Hotspots (unsichtbare Klick-Flächen) -->
            <rect id="hs-name" class="hotspot" x="50" y="20" width="200" height="40" />
            <rect id="hs-number" class="hotspot" x="20" y="90" width="100" height="30" />
            <rect id="hs-dress" class="hotspot" x="20" y="130" width="260" height="30" />
            <rect id="hs-total" class="hotspot" x="20" y="215" width="260" height="40" />
            <rect id="hs-payment" class="hotspot" x="20" y="260" width="260" height="30" />
            <rect id="hs-thanks" class="hotspot" x="20" y="330" width="260" height="40" />
        </svg>
    </div>

    <div class="controls">
        <button id="solution-btn">Lösung zeigen</button>
        <button id="reset-btn">Neustart</button>
    </div>
</div>

<script>
    const tasks = [
        { id: "hs-name", text: "Wo steht der Name des Ladens?" },
        { id: "hs-total", text: "Klicke auf den Gesamtbetrag (ИТОГО)." },
        { id: "hs-payment", text: "Wo steht, dass mit Karte (КАРТОЙ) bezahlt wurde?" },
        { id: "hs-dress", text: "Wo ist das Kleid (ПЛАТЬЕ) auf dem Bon?" },
        { id: "hs-number", text: "Finden Sie die Belegnummer (ЧЕК №)." },
        { id: "hs-thanks", text: "Wo bedankt sich der Laden für den Einkauf?" }
    ];

    let currentTaskIdx = 0;
    const taskEl = document.getElementById('current-task');
    const feedbackEl = document.getElementById('feedback');

    function initTask() {
        if (currentTaskIdx < tasks.length) {
            taskEl.textContent = tasks[currentTaskIdx].text;
            feedbackEl.textContent = "";
        } else {
            taskEl.textContent = "🎉 Hervorragend! Du kannst russische Kassenbons lesen.";
            feedbackEl.textContent = "";
        }
    }

    document.querySelectorAll('.hotspot').forEach(spot => {
        spot.onclick = () => {
            if (currentTaskIdx >= tasks.length) return;

            if (spot.id === tasks[currentTaskIdx].id) {
                // Richtig
                spot.classList.add('correct-flash');
                feedbackEl.style.color = "var(--success)";
                feedbackEl.textContent = "Правильно! (Richtig!)";
                
                setTimeout(() => {
                    spot.classList.remove('correct-flash');
                    currentTaskIdx++;
                    initTask();
                }, 1200);
            } else {
                // Falsch
                spot.classList.add('wrong-flash');
                feedbackEl.style.color = "var(--error)";
                feedbackEl.textContent = "Нет, попробуй еще раз.";
                setTimeout(() => spot.classList.remove('wrong-flash'), 500);
            }
        };
    });

    document.getElementById('solution-btn').onclick = () => {
        if (currentTaskIdx < tasks.length) {
            const correctSpot = document.getElementById(tasks[currentTaskIdx].id);
            correctSpot.classList.add('correct-flash');
            setTimeout(() => correctSpot.classList.remove('correct-flash'), 2000);
        }
    };

    document.getElementById('reset-btn').onclick = () => {
        currentTaskIdx = 0;
        initTask();
    };

    // Start
    initTask();
</script>

</body>
</html>
